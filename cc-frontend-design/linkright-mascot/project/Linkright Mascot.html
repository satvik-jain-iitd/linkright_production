<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pip — a mascot for LinkRight</title>
  <template id="__bundler_thumbnail" data-bg-color="#0E1620">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
      <!-- Pip — teal pixel blob with two black eyes, scaled to fill 70% of viewBox -->
      <g transform="translate(420 280) scale(24)">
        <!-- 14x10 sprite, each pixel is 1 unit -->
        <!-- row 0 -->
        <rect x="2" y="0" width="10" height="1" fill="#0FBEAF"/>
        <!-- row 1 -->
        <rect x="1" y="1" width="1" height="1" fill="#0FBEAF"/>
        <rect x="2" y="1" width="1" height="1" fill="#4DDCCE"/>
        <rect x="3" y="1" width="9" height="1" fill="#0FBEAF"/>
        <rect x="12" y="1" width="1" height="1" fill="#0FBEAF"/>
        <!-- row 2 -->
        <rect x="0" y="2" width="14" height="1" fill="#0FBEAF"/>
        <!-- row 3 — eyes -->
        <rect x="0" y="3" width="3" height="1" fill="#0FBEAF"/>
        <rect x="3" y="3" width="2" height="1" fill="#000"/>
        <rect x="5" y="3" width="4" height="1" fill="#0FBEAF"/>
        <rect x="9" y="3" width="2" height="1" fill="#000"/>
        <rect x="11" y="3" width="3" height="1" fill="#0FBEAF"/>
        <!-- row 4 — eyes -->
        <rect x="0" y="4" width="3" height="1" fill="#0FBEAF"/>
        <rect x="3" y="4" width="2" height="1" fill="#000"/>
        <rect x="5" y="4" width="4" height="1" fill="#0FBEAF"/>
        <rect x="9" y="4" width="2" height="1" fill="#000"/>
        <rect x="11" y="4" width="3" height="1" fill="#0FBEAF"/>
        <!-- rows 5–7 body -->
        <rect x="0" y="5" width="14" height="3" fill="#0FBEAF"/>
        <!-- row 8 -->
        <rect x="1" y="8" width="12" height="1" fill="#0FBEAF"/>
        <!-- row 9 -->
        <rect x="2" y="9" width="10" height="1" fill="#0FBEAF"/>
      </g>
      <!-- Gold star above -->
      <g transform="translate(560 140) scale(16)" fill="#E5B80B">
        <rect x="2" y="0" width="1" height="1"/>
        <rect x="1" y="1" width="3" height="1"/>
        <rect x="0" y="2" width="5" height="1"/>
        <rect x="1" y="3" width="3" height="1"/>
        <rect x="0" y="4" width="2" height="1"/>
        <rect x="3" y="4" width="2" height="1"/>
      </g>
    </svg>
  </template>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="colors_and_type.css" />
  <style>
    html, body { margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: #F2EAE0; color: var(--color-foreground); -webkit-font-smoothing: antialiased; }
    #root { width: 100%; height: 100vh; }

    /* Sprite / cursor animation keyframes */
    @keyframes pipBlink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes pipDot {
      0%, 80%, 100% { opacity: 0.25; }
      40% { opacity: 1; }
    }
    @keyframes pipSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes pipFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- design canvas -->
  <script type="text/babel" src="design-canvas.jsx"></script>

  <!-- mascot primitives -->
  <script type="text/babel" src="pip-sprite.jsx"></script>
  <script type="text/babel" src="linkright-banner.jsx"></script>
  <script type="text/babel" src="terminal.jsx"></script>

  <!-- sections -->
  <script type="text/babel" src="sections-critique.jsx"></script>
  <script type="text/babel" src="sections-hero.jsx"></script>
  <script type="text/babel" src="sections-meet.jsx"></script>
  <script type="text/babel" src="sections-cli.jsx"></script>
  <script type="text/babel" src="sections-variants.jsx"></script>

  <!-- shell -->
  <script type="text/babel" src="showcase.jsx"></script>
</body>
</html>
