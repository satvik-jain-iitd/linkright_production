<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pip — a mascot for LinkRight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="colors_and_type.css" />
  <style>
    html, body { margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: #F2EAE0; color: var(--color-foreground); -webkit-font-smoothing: antialiased; }
    #root { width: 100%; height: 100vh; }

    /* Sprite / cursor animation keyframes */
    @keyframes pipBlink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes pipDot {
      0%, 80%, 100% { opacity: 0.25; }
      40% { opacity: 1; }
    }
    @keyframes pipSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes pipFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- design canvas -->
  <script type="text/babel" src="design-canvas.jsx"></script>

  <!-- mascot primitives -->
  <script type="text/babel" src="pip-sprite.jsx"></script>
  <script type="text/babel" src="stickman.jsx"></script>
  <script type="text/babel" src="ascii-pip.jsx"></script>
  <script type="text/babel" src="linkright-banner.jsx"></script>
  <script type="text/babel" src="terminal.jsx"></script>
  <script type="text/babel" src="cli-primitives.jsx"></script>
  <script type="text/babel" src="cc-primitives.jsx"></script>

  <!-- sections (ASCII direction only) -->
  <script type="text/babel" src="sections-ascii.jsx"></script>
  <script type="text/babel" src="sections-primitives.jsx"></script>
  <script type="text/babel" src="sections-cli-ascii.jsx"></script>
  <script type="text/babel" src="sections-future.jsx"></script>
  <script type="text/babel" src="sections-cc-true.jsx"></script>

  <!-- shell -->
  <script type="text/babel" src="showcase.jsx"></script>
</body>
</html>
