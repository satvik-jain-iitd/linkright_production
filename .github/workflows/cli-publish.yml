name: cli-publish

# Auto-publish the linkright CLI to PyPI on every push to main that bumps
# context/cli/linkright/pyproject.toml. Zero manual steps — bump version
# in your PR, merge, done.
#
# Flow:
#   1. Read + validate version from pyproject.toml (hard-fail on empty)
#   2. Check if git tag v{version} already exists — skip entirely if it does
#   3. Verify PYPI_API_TOKEN secret is set (fail fast before any mutation)
#   4. Build wheel + sdist, upload to PyPI
#   5. Create + push the git tag ONLY after successful upload
#      (tag-after-upload prevents orphaned tags on build/upload failure)
#
# Pre-flight (one-time setup, owner only):
#   1. Create PyPI API token at https://pypi.org/manage/account/token/
#      Scope: project = "linkright"
#   2. Add as GitHub Actions secret named PYPI_API_TOKEN at
#      https://github.com/satvik-jain-iitd/linkright_production/settings/secrets/actions

on:
  push:
    branches:
      - main
    paths:
      - "context/cli/linkright/pyproject.toml"

permissions:
  contents: write   # needed to push the git tag after successful upload

jobs:
  build-and-publish:
    name: Build wheel + upload to PyPI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: context/cli/linkright

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed to check existing tags

      - name: Read + validate version from pyproject.toml
        id: version
        run: |
          ver=$(grep -E '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          if [ -z "$ver" ]; then
            echo "::error::Could not extract version from pyproject.toml. Check that the file contains a line matching: version = \"X.Y.Z\""
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Detected version: $ver"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} is new — will publish."
          fi

      - name: Verify PYPI_API_TOKEN secret is set
        if: steps.tag_check.outputs.exists == 'false'
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "::error::PYPI_API_TOKEN secret is not set. Add it at:"
            echo "::error::https://github.com/satvik-jain-iitd/linkright_production/settings/secrets/actions"
            echo "::error::Failing before any build or tag mutation to avoid orphaned state."
            exit 1
          fi
          echo "PYPI_API_TOKEN is set."

      - name: Set up Python
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        if: steps.tag_check.outputs.exists == 'false'
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel + sdist
        if: steps.tag_check.outputs.exists == 'false'
        run: python -m build

      - name: Upload to PyPI
        if: steps.tag_check.outputs.exists == 'false'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive --verbose dist/*

      - name: Create and push tag (after successful upload)
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Summary — published
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          echo "### ✓ Published to PyPI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Tag: \`v${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Project page: https://pypi.org/project/linkright/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Users upgrade with: \`linkright update\` or \`pip install --upgrade linkright\`" >> $GITHUB_STEP_SUMMARY

      - name: Summary — skipped
        if: steps.tag_check.outputs.exists == 'true'
        run: |
          echo "### ⏭ Skipped — version already on PyPI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version \`${{ steps.version.outputs.version }}\` tag already exists. No publish needed." >> $GITHUB_STEP_SUMMARY
