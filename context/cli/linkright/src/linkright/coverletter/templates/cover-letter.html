<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Letter</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --page-width: 210mm;
            --page-height: 297mm;
            --page-margin: 25mm;
            --font-size-name: 14pt;
            --font-size-body: 10.5pt;
            --font-size-contact: 9.5pt;
            --line-height-body: 1.4;
            --paragraph-spacing: 1em;
            --color-text: #000000;
            --color-text-secondary: #444444;
            --color-divider: #DADCE0;
            --ui-canvas-bg-color: #F1F3F4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
        }

        body {
            font-family: 'Roboto', 'Georgia', 'Times New Roman', serif;
            color: var(--color-text);
            background-color: var(--ui-canvas-bg-color);
            display: flex;
            justify-content: center;
            padding: 30px 0;
        }

        .page {
            width: var(--page-width);
            min-height: var(--page-height);
            background: #FFFFFF;
            padding: var(--page-margin);
            box-shadow: 0 1px 3px rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
            display: flex;
            flex-direction: column;
        }

        @media print {
            body {
                background: none;
                padding: 0;
            }
            .page {
                margin: 0;
                box-shadow: none;
                border: none;
                width: 100%;
                min-height: 100vh;
            }
            @page {
                size: A4;
                margin: 25mm;
            }
        }

        /* ── Header ── */
        .header {
            margin-bottom: 20pt;
            text-align: left;
        }

        .candidate-name {
            font-size: var(--font-size-name);
            font-weight: 700;
            color: var(--color-text);
            letter-spacing: 0.2px;
            margin-bottom: 4pt;
        }

        .contact-line {
            font-size: var(--font-size-contact);
            color: var(--color-text-secondary);
            font-weight: 400;
            line-height: 1.3;
        }

        .contact-line .separator {
            margin: 0 6px;
            color: var(--color-divider);
        }

        /* ── Date block ── */
        .date-block {
            font-size: var(--font-size-body);
            color: var(--color-text);
            text-align: right;
            margin-bottom: 16pt;
        }

        /* ── Recipient block ── */
        .recipient-block {
            font-size: var(--font-size-body);
            color: var(--color-text);
            margin-bottom: 14pt;
            line-height: var(--line-height-body);
        }

        /* ── Body paragraphs ── */
        .letter-body {
            flex: 1;
        }

        .paragraph {
            font-size: var(--font-size-body);
            color: var(--color-text);
            line-height: var(--line-height-body);
            text-align: justify;
            margin-bottom: var(--paragraph-spacing);
        }

        /* ── Signature block ── */
        .signature-block {
            margin-top: 20pt;
            font-size: var(--font-size-body);
            color: var(--color-text);
            line-height: var(--line-height-body);
        }

        .signature-name {
            font-weight: 500;
            margin-top: 4pt;
        }
    </style>
</head>
<body>
    <div class="page">

        <!-- Header: candidate name + contact -->
        <div class="header">
            <div class="candidate-name">{{name}}</div>
            <div class="contact-line">
                <span>{{email}}</span>
                {{phone_sep}}<span>{{phone}}</span>
                {{linkedin_sep}}<span>{{linkedin}}</span>
                {{location_sep}}<span>{{location}}</span>
            </div>
        </div>

        <!-- Date (right-aligned) -->
        <div class="date-block">{{date}}</div>

        <!-- Recipient greeting -->
        <div class="recipient-block">Dear {{recipient}},</div>

        <!-- Body: 3 paragraphs -->
        <div class="letter-body">
            <div class="paragraph">{{paragraph_1}}</div>
            <div class="paragraph">{{paragraph_2}}</div>
            <div class="paragraph">{{paragraph_3}}</div>
        </div>

        <!-- Signature -->
        <div class="signature-block">
            <div>Best regards,</div>
            <div class="signature-name">{{name}}</div>
        </div>

    </div>
</body>
</html>
