# signal_weights.yaml — S3.1: 13-signal × 5-career-level multiplier matrix.
#
# Each cell is a float in [0.5, 2.5].
# Applied in step_11_rank: weighted_brs = base_brs * weight_matrix[signal][career_level]
#
# Design principles:
#   executive:    surface executive-influence + leadership + revenue-impact first
#   senior:       surface scale + growth + leadership; balanced build-execution
#   mid:          surface revenue-impact + data-driven + build-execution; balanced
#   early_career: surface build-execution + automation + data-driven; downweight exec
#   fresher:      surface build-execution + user-empathy + execution; heavily downweight exec
#
# S3.1 — 2026-05-11

